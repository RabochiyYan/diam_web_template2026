<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray Gingers from Outer Space</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="station">
        <header id="mission">
            <p class="label">Экспедиция 07 / дальний космос</p>
            <h1 lang="en">Ray Gingers<br><span>from Outer Space</span></h1>
        </header>

        <nav aria-label="Навигация по странице">
            <a href="#mission">Миссия</a>
            <a href="#flight">Карта полёта</a>
            <a href="#credits">Автор</a>
        </nav>

        <main class="main" id="flight">
            <div class="panel-heading">
                <h2>Карта полёта</h2>
                <p class="label">Сектор 07</p>
            </div>
            <canvas id="game" width="960" height="420" role="img"
                aria-label="Корабль на орбите оранжевой планеты в звёздном поле">
                Корабль на орбите оранжевой планеты в звёздном поле.
            </canvas>
        </main>

        <footer id="credits">
            <p>Автор · <span>Яненков Сергей Денисович</span></p>
        </footer>
    </div>
</body>
</html>
